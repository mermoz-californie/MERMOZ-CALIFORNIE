<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Démo gélatine</title>
<style>
/* ============================================================
   DÉMO : DEUX ÉTIQUETTES EN GÉLATINE, SANS CASSURE

   La version en quatre quartiers montrait des plis aux coins et
   des traits aux jointures : chaque quartier se déformait pour
   lui-même, et deux morceaux voisins ne tombaient jamais sur le
   même pixel.

   Ici, plus de morceaux du tout. Le dessin est posé sur un filet
   de 40 sur 40 cases, peint par la carte graphique. Attraper
   l'étiquette déplace les points du filet autour du point saisi,
   de moins en moins loin à mesure qu'on s'en éloigne, jusqu'à
   zéro sur les bords. La matière s'étire d'un seul tenant :
   aucun pli, aucune jointure.

   La version en quartiers reste à côté, dans
   _demo-gelatine-quartiers.html, pour comparer.

   Le nom commence par un tiret bas : GitHub Pages ignore ces
   fichiers, la démo ne sera jamais publiée.
   ============================================================ */
:root{
  --noir:  #222221;
  --blanc: #E0DFD9;
  --vert:  #4AD66D;
  --filet: rgba(224, 223, 217, .16);
}
*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  background: var(--noir); color: var(--blanc);
  font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.tete{
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  padding: 14px 22px; border-bottom: 1px solid var(--filet);
}
.tete h1{ font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin: 0; font-weight: 600; }
.tete p{ margin: 0; color: rgba(224,223,217,.55); }
.tete a{ color: var(--vert); }

.reglages{
  display: flex; gap: 20px; flex-wrap: wrap;
  padding: 10px 22px; border-bottom: 1px solid var(--filet);
}
.reglage{ display: flex; align-items: center; gap: 9px; }
.reglage label{ font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(224,223,217,.55); }
.reglage output{ font-variant-numeric: tabular-nums; min-width: 3.2em; }
input[type=range]{ accent-color: var(--vert); width: 120px; }

.terrain{ position: relative; flex: 1; overflow: hidden; }

/* une étiquette : un canevas qui se déplace, et dont le contenu
   se déforme tout seul */
.etiq{
  position: absolute;
  touch-action: none; user-select: none;
  will-change: transform;
  /* le clic est jugé sur le dessin par le terrain : les boîtes
     elles-mêmes ne doivent rien intercepter */
  pointer-events: none;
}
.terrain{ cursor: default; }
.etiq:active{ cursor: grabbing; }
.etiq canvas{ display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="tete">
  <h1>Gélatine sans cassure</h1>
  <p>Attrape, déplace, lâche. La déformation part du point saisi et s'éteint vers les bords, d'un seul tenant. <a href="_demo-gelatine-quartiers.html">Voir l'ancienne version en quartiers</a></p>
</div>

<div class="reglages">
  <div class="reglage"><label for="gain">Pincement</label><input id="gain" type="range" min="0" max="10" step=".1" value="5.6"><output id="gainV">5.60</output></div>
  <div class="reglage"><label for="rayon">Étendue</label><input id="rayon" type="range" min=".05" max="2" step=".01" value="0.65"><output id="rayonV">0.65</output></div>
  <div class="reglage"><label for="raideur">Raideur</label><input id="raideur" type="range" min=".05" max=".4" step=".01" value="0.15"><output id="raideurV">0.15</output></div>
  <div class="reglage"><label for="amorti">Rebonds</label><input id="amorti" type="range" min=".6" max=".95" step=".01" value="0.84"><output id="amortiV">0.84</output></div>
</div>

<div class="terrain" id="terrain">
  <div class="etiq" data-src="assets/pastilles/1.svg" style="left: 5%; top: 22%; width: min(34vw, 420px);"></div>
  <div class="etiq" data-src="assets/autres_pastilles/contact.svg" style="left: 58%; top: 26%; width: min(22vw, 260px);"></div>
</div>

<script>
(function(){
  "use strict";

  var R = { gain: 5.6, rayon: .65, raideur: .15, amorti: .84 };
  ['gain', 'rayon', 'raideur', 'amorti'].forEach(function(nom){
    var c = document.getElementById(nom), o = document.getElementById(nom + 'V');
    c.addEventListener('input', function(){ R[nom] = parseFloat(c.value); o.textContent = c.value; });
  });

  /* Le filet : 40 cases de côté. Plus il est fin, plus la
     déformation est douce, et le coût reste négligeable. */
  var CASES = 40;

  var SOMMET = [
    'attribute vec2 aPos;',
    'uniform vec2 uGrab;',      /* le point saisi, en 0..1 */
    'uniform vec2 uLag;',       /* le retard, en fraction de la taille */
    'uniform float uRayon;',    /* l etendue de la deformation */
    'varying vec2 vUV;',
    'void main(){',
    '  vUV = aPos;',
    /* Le point tenu reste sous le doigt, et toute la matière
       traîne derrière, d'autant plus qu'elle est loin du point
       saisi : l'étiquette s'étire en entier, des deux côtés. */
    '  float d = distance(aPos, uGrab) / max(uRayon, 0.0001);',
    '  float traine = 1.0 - exp(-d * d);',
    '  vec2 p = aPos - uLag * traine;',
    '  gl_Position = vec4(p.x * 2.0 - 1.0, 1.0 - p.y * 2.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  var FRAGMENT = [
    'precision mediump float;',
    'uniform sampler2D uTex;',
    'varying vec2 vUV;',
    'void main(){ gl_FragColor = texture2D(uTex, vUV); }'
  ].join('\n');

  function compile(gl, type, source){
    var s = gl.createShader(type);
    gl.shaderSource(s, source); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s));
    return s;
  }

  /* le maillage : une grille de triangles, en coordonnées 0..1 */
  function maille(n){
    var pts = [];
    for(var j = 0; j < n; j++){
      for(var i = 0; i < n; i++){
        var x0 = i / n, x1 = (i + 1) / n, y0 = j / n, y1 = (j + 1) / n;
        pts.push(x0, y0, x1, y0, x0, y1,  x1, y0, x1, y1, x0, y1);
      }
    }
    return new Float32Array(pts);
  }

  var lot = [];
  var terrain = document.getElementById('terrain');

  /* Le clic est jugé sur le dessin, pas sur la boîte : les
     étiquettes sont des rectangles largement vides, et sans ce
     tri on attraperait celle du dessus même en cliquant à côté
     de son dessin. On parcourt donc de la plus haute à la plus
     basse, et on prend la première dont l'encre est sous le
     doigt. */
  terrain.addEventListener('pointermove', function(e){
    var sur = false;
    for(var i = lot.length - 1; i >= 0 && !sur; i--) sur = lot[i].surEncre(e.clientX, e.clientY);
    terrain.style.cursor = sur ? 'grab' : '';
  });

  terrain.addEventListener('pointerdown', function(e){
    for(var i = lot.length - 1; i >= 0; i--){
      if(lot[i].surEncre(e.clientX, e.clientY)){
        e.preventDefault();
        lot[i].attrape(e);
        return;
      }
    }
  });

  document.querySelectorAll('.etiq').forEach(function(etiq){
    var canvas = document.createElement('canvas');
    etiq.appendChild(canvas);
    var gl = canvas.getContext('webgl', { premultipliedAlpha: true, antialias: true });
    if(!gl){ etiq.textContent = 'WebGL indisponible'; return; }

    var prog = gl.createProgram();
    gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, SOMMET));
    gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, FRAGMENT));
    gl.linkProgram(prog); gl.useProgram(prog);

    var pts = maille(CASES);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, pts, gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

    var uGrab = gl.getUniformLocation(prog, 'uGrab');
    var uLag = gl.getUniformLocation(prog, 'uLag');
    var uRayon = gl.getUniformLocation(prog, 'uRayon');

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.clearColor(0, 0, 0, 0);

    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    var pret = false, cadre = { marge: 0, ech: 1 }, encre = null;

    /* Le SVG est rastérisé une fois, à deux fois la taille
       affichée : le filet a besoin d'une image, pas d'un dessin
       vectoriel.

       Le fichier est lu d'abord comme texte, pour deux raisons.
       Ses proportions sont dans son viewBox, et rien d'autre :
       sans largeur ni hauteur déclarées, Safari répond zéro quand
       on les demande à l'image, et le dessin se perd dans un
       canevas de taille nulle. On lui écrit donc sa taille en
       clair avant de l'afficher.

       Un PNG transparent éviterait cette gymnastique, mais il est
       figé à sa résolution d'export, là où le SVG se rastérise
       toujours à la taille utile. */
    function proportions(txt){
      var vb = txt.match(/viewBox\s*=\s*["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/);
      if(vb) return parseFloat(vb[1]) / parseFloat(vb[2]);
      var w = txt.match(/<svg[^>]*\swidth\s*=\s*["']([\d.]+)/),
          h = txt.match(/<svg[^>]*\sheight\s*=\s*["']([\d.]+)/);
      return (w && h) ? parseFloat(w[1]) / parseFloat(h[1]) : 1;
    }

    fetch(etiq.dataset.src).then(function(r){ return r.text(); }).then(function(txt){
      var rapport = proportions(txt);
      var L = etiq.clientWidth;
      var H = Math.round(L / rapport);
      etiq.style.height = H + 'px';

      /* la taille écrite en clair dans le fichier servi */
      var svg = txt.replace(/<svg\b/, '<svg width="' + (L * 2) + '" height="' + (H * 2) + '"');
      var url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));

      var img = new Image();
      img.onload = function(){
        /* Le dessin traîne hors de sa boîte quand on tire : le
           canevas est donc plus grand que l'étiquette, avec une
           marge tout autour, et le dessin est peint au milieu. */
        var MARGE = .5;
        var large = Math.round(L * 2 * (1 + MARGE * 2));
        var haut  = Math.round(H * 2 * (1 + MARGE * 2));
        canvas.width = large; canvas.height = haut;
        canvas.style.position = 'absolute';
        canvas.style.left = (-L * MARGE) + 'px';
        canvas.style.top = (-H * MARGE) + 'px';
        canvas.style.width = (L * (1 + MARGE * 2)) + 'px';
        canvas.style.height = (H * (1 + MARGE * 2)) + 'px';

        var c2 = document.createElement('canvas');
        c2.width = large; c2.height = haut;
        c2.getContext('2d').drawImage(img, L * MARGE * 2, H * MARGE * 2, L * 2, H * 2);

        /* La carte de l'encre : le dessin seul, en petit, dont on
           ne garde que la transparence. Elle sert à juger si le
           doigt tombe sur le dessin ou sur le vide autour. */
        var cw = 180, ch = Math.max(1, Math.round(cw / (L / H)));
        var c3 = document.createElement('canvas');
        c3.width = cw; c3.height = ch;
        c3.getContext('2d').drawImage(img, 0, 0, cw, ch);
        try{
          var px = c3.getContext('2d').getImageData(0, 0, cw, ch).data;
          encre = { w: cw, h: ch, a: new Uint8Array(cw * ch) };
          for(var n = 0; n < cw * ch; n++) encre.a[n] = px[n * 4 + 3];
        }catch(err){ encre = null; }
        URL.revokeObjectURL(url);

        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c2);
        gl.viewport(0, 0, large, haut);
        cadre = { marge: MARGE, ech: 1 / (1 + MARGE * 2) };
        pret = true;
        dessine();
      };
      img.onerror = function(){ etiq.textContent = 'image illisible'; };
      img.src = url;
    });

    function dessine(){
      if(!pret) return;
      gl.clear(gl.COLOR_BUFFER_BIT);
      /* passage du repère de l'étiquette à celui du canevas */
      gl.uniform2f(uGrab, (gel.gx + cadre.marge) * cadre.ech, (gel.gy + cadre.marge) * cadre.ech);
      gl.uniform2f(uLag, gel.x * cadre.ech, gel.y * cadre.ech);
      gl.uniform1f(uRayon, R.rayon);
      gl.drawArrays(gl.TRIANGLES, 0, pts.length / 2);
    }

    /* l'état : la position de l'étiquette, le point saisi, et le
       retard porté par un ressort */
    var pos = { x: 0, y: 0 };
    var gel = { gx: .5, gy: .5, x: 0, y: 0, vx: 0, vy: 0 };
    var prise = null, suivi = { x: 0, y: 0 }, vise = { x: 0, y: 0 }, boucle = null;

    function borne(v, m, M){ return Math.max(m, Math.min(M, v)); }
    function ressort(v, vit, cible){
      vit = (vit + (cible - v) * R.raideur) * R.amorti;
      return [v + vit, vit];
    }

    function tourne(){
      boucle = null;
      var cx = 0, cy = 0;
      if(prise){
        var ex = vise.x - suivi.x, ey = vise.y - suivi.y;
        suivi.x += ex * .30; suivi.y += ey * .30;
        pos.x = prise.px + (suivi.x - prise.x);
        pos.y = prise.py + (suivi.y - prise.y);
        etiq.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px)';
        /* le retard, ramené en fraction de l'étiquette */
        cx = borne(ex / etiq.clientWidth * R.gain, -.75, .75);
        cy = borne(ey / etiq.clientHeight * R.gain, -.75, .75);
      }
      if(prise){
        /* Sous la main, la déformation colle au geste : pas de
           ressort, sinon l'étiquette ballotte pendant qu'on la
           tire. On garde quand même la variation d'une image à
           l'autre : elle servira d'élan au moment du lâcher. */
        gel.vx = cx - gel.x; gel.vy = cy - gel.y;
        gel.x = cx; gel.y = cy;
      } else {
        /* Lâchée, elle revient au repos par un ressort : il
           dépasse, revient, redépasse moins loin. C'est là, et là
           seulement, que la gélatine tremble. */
        var r;
        r = ressort(gel.x, gel.vx, 0); gel.x = r[0]; gel.vx = r[1];
        r = ressort(gel.y, gel.vy, 0); gel.y = r[0]; gel.vy = r[1];
      }
      dessine();

      var dort = !prise &&
        Math.abs(gel.x) < .0006 && Math.abs(gel.y) < .0006 &&
        Math.abs(gel.vx) < .0006 && Math.abs(gel.vy) < .0006;
      if(dort){ gel.x = gel.y = gel.vx = gel.vy = 0; dessine(); }
      else boucle = requestAnimationFrame(tourne);
    }

    /* le doigt tombe-t-il sur le dessin ? */
    function surEncre(x, y){
      if(!pret) return false;
      var b = etiq.getBoundingClientRect();
      if(x < b.left || x > b.right || y < b.top || y > b.bottom) return false;
      if(!encre) return true;
      var i = Math.floor((x - b.left) / b.width * encre.w);
      var j = Math.floor((y - b.top) / b.height * encre.h);
      if(i < 0 || j < 0 || i >= encre.w || j >= encre.h) return false;
      return encre.a[j * encre.w + i] > 24;
    }

    function attrape(e){
      var b = etiq.getBoundingClientRect();
      gel.gx = borne((e.clientX - b.left) / b.width, 0, 1);
      gel.gy = borne((e.clientY - b.top) / b.height, 0, 1);
      prise = { x: e.clientX, y: e.clientY, px: pos.x, py: pos.y };
      vise.x = suivi.x = e.clientX; vise.y = suivi.y = e.clientY;
      etiq.parentNode.appendChild(etiq);     /* au premier plan */
      if(!boucle) boucle = requestAnimationFrame(tourne);
    }

    /* la liste des étiquettes, pour que le terrain choisisse
       laquelle est sous le doigt */
    lot.push({ el: etiq, surEncre: surEncre, attrape: attrape });

    /* Le suivi se fait sur la fenêtre : la boîte de l'étiquette
       n'intercepte plus rien, c'est le terrain qui décide de la
       prise, et le geste doit continuer même en sortant du
       dessin. */
    window.addEventListener('pointermove', function(e){
      if(prise){ vise.x = e.clientX; vise.y = e.clientY; }
    });

    function lache(){
      if(!prise) return;
      prise = null;
      if(!boucle) boucle = requestAnimationFrame(tourne);
    }
    window.addEventListener('pointerup', lache);
    window.addEventListener('pointercancel', lache);
  });
})();
</script>
</body>
</html>
