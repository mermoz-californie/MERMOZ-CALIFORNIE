<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gleeden — Typo PP Object Sans</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   SECTION TYPO OBJECT SANS
   - Full   : fond violet sombre #551565 (fourni par le parent), logo Gleeden + ligne + "PP Object Sans bold"
   - Réduc  : panel-inner devient #280F37 (violet clair arrondi), showcase 4 weights apparaît
   - Motion fluide identique aux autres sections (transitions parent synchronisées).
   ─────────────────────────────────────────────────────────────────────── */

/* ─── Fonts PP Object Sans (chemin partagé avec gleeden/) ─── */
@font-face{font-family:'PPObjectSans';src:url('../../assets/fonts/PPObjectSans/PPObjectSans-Thin.woff') format('woff');font-weight:100;font-display:swap;}
@font-face{font-family:'PPObjectSans';src:url('../../assets/fonts/PPObjectSans/PPObjectSans-Regular.woff') format('woff');font-weight:400;font-display:swap;}
@font-face{font-family:'PPObjectSans';src:url('../../assets/fonts/PPObjectSans/PPObjectSans-Bold.woff') format('woff');font-weight:700;font-display:swap;}
@font-face{font-family:'PPObjectSans';src:url('../../assets/fonts/PPObjectSans/PPObjectSans-Heavy.woff') format('woff');font-weight:900;font-display:swap;}

:root{
  --bg:       #551565;
  --accent:   #C880EA;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html, body{ overflow:hidden; margin:0; width:100%; height:100%; cursor:none; background: transparent; }
body{
  background: transparent;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100vw; height: 100vh;
  font-family: 'PPObjectSans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--accent);
}
*{ cursor:none !important; }
.annot-label, .row-text, .row-name, .row-label{ user-select:text; -webkit-user-select:text; cursor:text !important; }

.stage{
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 0 6vw;
}

/* ─── LOGO + annotation wrapper : largeur définie par le logo, annot stretch ─── */
.logo-block{
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;   /* annot prend la même largeur que le logo */
}

/* ─── MASQUE GIF — rectangle inset 67px + radius 16px (taille d'un layout réduc) ─── */
.gif-mask{
  position: absolute;
  top: 67px; left: 67px; right: 67px; bottom: 67px;
  border-radius: 16px;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.6s ease;
  z-index: 0;                  /* derrière la tagline overlay */
}
body.go .gif-mask{ opacity: 1; transition-delay: 0.05s; }
body.dezoom .gif-mask{ display: none; }

.logo-gif{
  display: block;
  height: 170vh;             /* gif zoomé, déborde de la viewport */
  width: auto;
  max-width: none;
  object-fit: contain;
  flex-shrink: 0;
  transform: translateY(-8vh);   /* gif remonté à l'intérieur du masque */
}

/* ─── Tagline — masquée en mode FULL, placée sous le logo en RÉDUC ─── */
.gif-tagline{
  display: none;
  /* font-family hérité du body = 'PPObjectSans' */
  font-size: 2.2vh;
  font-weight: 400;
  color: #F8F1E6;
  letter-spacing: 0.01em;
  white-space: nowrap;
  text-align: center;
  pointer-events: none;
}
body.dezoom .gif-tagline{
  display: block;
  align-self: center;        /* override align-items:stretch du parent .logo-block */
  margin-top: 12vh;          /* gap sous le logo (compense le scale 1.25) */
}
.gif-tagline .tag-italic{
  font-style: italic;
  color: var(--accent);                        /* rose lavande #C880EA */
  font-weight: 400;
}
.gif-tagline sup{ font-size: 0.55em; vertical-align: super; line-height: 0; }
/* Chars : opacity 0 par défaut, contrôlée explicitement par JS via setTimeout
   pour pouvoir re-jouer la séquence à chaque entrée en réduc. La transition
   fait un fade-in court par caractère pour adoucir l'effet typewriter. */
.gif-tagline .ch{
  opacity: 0;
  transition: opacity 0.18s ease;
}

/* ─── LOGO Gleeden statique — visible en mode RÉDUC uniquement ─── */
.logo{
  display: none;             /* caché en full — le gif prend sa place */
  align-items: flex-end;
  --gap: 0;
}
body.dezoom .logo{ display: flex; transform: scale(1.25) translateX(-1.6vh); transform-origin: center center; }

/* Logo SVG complet (remplace l'ancien picto + lettres tapées). Hauteur calée
   sur ce que faisaient les lettres (24vh) ; le scale 1.25 du parent .logo
   gère le grossissement final. */
.logo-svg{
  display: block;
  height: 20vh;
  width: auto;
}
.picto-wrap{
  position: relative;
  left: 2px;
  margin-bottom: calc(4.5vh - 3px);   /* remonte le picto au-dessus de la baseline (descendu de 3px par rapport à 4.5vh) */
}
.picto{
  width: 19vh;
  height: auto;
  display: block;
}
.letters{
  display: inline-flex;
  margin-left: -4px;
}
.letter{
  font-family: 'PPObjectSans', sans-serif;
  font-size: 24vh;
  font-weight: 700;
  line-height: 1;
  color: var(--accent);
  display: inline-block;
  padding-right: 0.04em;
}
.letter:last-child{ padding-right: 0; }   /* "n" sans padding-right pour aligner le bord droit du logo sur le bord visible du "n" */
.letter + .letter{ margin-left: var(--gap); }
/* Kerning identique à case0 */
.letter:nth-child(2){ margin-left: calc(-2vh - 4px); }      /* 1er "e" */
.letter:nth-child(3){ margin-left: calc(-1.5vh - 4px); }    /* 2e "e" */
.letter:nth-child(4){ margin-left: calc(-2vh); }            /* "d" */
.letter:nth-child(5){ margin-left: calc(-2.625vh); }        /* 3e "e" */
.letter:nth-child(6){ margin-left: calc(-2.625vh); }        /* "n" */

/* ─── Annotation ligne + label sous le logo (cachée en full pour libérer la hauteur au gif) ─── */
.annot{
  display: none;
  align-items: center;
  margin-top: 1.6vh;
  width: 100%;             /* = largeur du logo grâce au wrapper logo-block */
}
body.dezoom .annot{ display: flex; }
.annot-line{
  flex: 1;
  height: 1px;
  background: var(--accent);
  opacity: 0.55;
}
.annot-label{
  margin-left: 1.5vh;
  margin-right: 3px;   /* décalage du label vers la gauche */
  font-size: 1.3vh;
  font-weight: 400;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* ─── Showcase — 2 rows (Regular + Bold) — visible UNIQUEMENT en réduc ─── */
.showcase{
  margin-top: 6vh;
  display: none;
  flex-direction: column;
  gap: 4vh;
  width: 100%;
  opacity: 0;
  transition: opacity 0.4s ease;
}
body.dezoom .showcase{ display: flex; opacity: 1; }

.row{
  display: flex;
  align-items: center;
}
.row-text{
  font-size: 2.4vh;
  font-weight: 400;
  letter-spacing: 0.005em;
  margin-right: 1.5vh;     /* gap entre texte et ligne (= gap label↔ligne dans la top annot) */
  flex-shrink: 0;
}
.row-text.bold{ font-weight: 700; }

/* Ligne identique en épaisseur + opacité à .annot-line */
.row-line{
  flex: 1;
  height: 1px;
  background: var(--accent);
  opacity: 0.55;
}

/* Label avec EXACTEMENT le même style que .annot-label (top "PP Object Sans bold") */
.row-label{
  margin-left: 1.5vh;
  margin-right: 3px;
  font-size: 1.3vh;
  font-weight: 400;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* ─── ANIMATIONS D'ENTRÉE (body.go déclenché par le parent) ─── */
/* Le gif a son propre fade-in (body.go .logo-gif plus haut).
   Le logo statique apparaît seulement en réduc (display:flex via body.dezoom) — pas d'anim,
   le mouvement du panel-inner couvre visuellement la transition. */
/* .annot (ligne + label typo) : caché en full, fade-in pur en réduc */
.annot{
  opacity: 0;
  transition: opacity 0.4s ease;
}
body.dezoom .annot{ opacity: 1; }
</style>
</head>
<body>

<div class="stage">
  <div class="logo-block">
    <!-- Mode FULL : gif animé en fond (rien d'autre) -->
    <div class="gif-mask"><img class="logo-gif" src="../../assets/visuels/anim_logo_2027.gif" alt="Gleeden — logo animé"></div>
    <!-- Mode RÉDUC : logo Gleeden complet (SVG vectorisé) + tagline en dessous -->
    <div class="logo">
      <img class="logo-svg" src="../../assets/visuels/GLEEDEN_2027.svg" alt="Gleeden">
    </div>
    <div class="gif-tagline">Le 1<sup>er</sup> site de rencontres extra-conjugales, <em class="tag-italic">pens&eacute; par des femmes,</em> pour les femmes.</div>
  </div>
</div>

<script>
/* ─── Split de la gif-tagline en chars (1 span par caractère) ─── */
function splitGifTagline(){
  const tag = document.querySelector('.gif-tagline');
  if (!tag || tag.dataset.split) return;
  tag.dataset.split = '1';
  function walk(node){
    if (node.nodeType === Node.TEXT_NODE){
      const frag = document.createDocumentFragment();
      for (const ch of node.textContent){
        const span = document.createElement('span');
        span.className = 'ch';
        span.textContent = ch;
        frag.appendChild(span);
      }
      node.parentNode.replaceChild(frag, node);
    } else if (node.nodeType === Node.ELEMENT_NODE){
      Array.from(node.childNodes).forEach(walk);
    }
  }
  Array.from(tag.childNodes).forEach(walk);
}
splitGifTagline();

/* ─── Typewriter contrôlé en JS — rejouable à chaque passage en réduc ─── */
const TW_START_DELAY      = 0.35;   /* attente avant le 1er char (s) */
const TW_CHAR_STEP        = 0.04;   /* gap entre chars (s) */
const TW_PAUSE_AFTER_PART = 0.32;   /* pause supplémentaire après une virgule (s) */
let _twTimers = [];
function clearTagline(){
  _twTimers.forEach(t => clearTimeout(t));
  _twTimers = [];
  document.querySelectorAll('.gif-tagline .ch').forEach(c => { c.style.opacity = '0'; });
}
function playTagline(){
  const chars = document.querySelectorAll('.gif-tagline .ch');
  if (!chars.length) return;
  clearTagline();
  /* Force reflow pour que les transitions repartent du nouvel état (opacity 0). */
  void document.body.offsetHeight;
  let extraPause = 0;
  let i = 0;
  for (const ch of chars) {
    const text = ch.textContent;
    const delayMs = (TW_START_DELAY + i * TW_CHAR_STEP + extraPause) * 1000;
    _twTimers.push(setTimeout(() => { ch.style.opacity = '1'; }, delayMs));
    i++;
    if (text === ',') extraPause += TW_PAUSE_AFTER_PART;
  }
}

function replay(){
  document.body.classList.remove('go');
  void document.body.offsetHeight;
  document.body.classList.add('go');
}
window.addEventListener('message', function(e){
  if (e.data === 'replay') replay();
});

/* Sync immédiate body.dezoom avec body.bg-open du parent + rejoue le typewriter
   à chaque entrée en réduc, le reset à chaque sortie. */
(function syncDezoom(){
  let _wasDezoom = false;
  const handle = (isDz) => {
    document.body.classList.toggle('dezoom', isDz);
    if (isDz && !_wasDezoom) playTagline();
    else if (!isDz && _wasDezoom) clearTagline();
    _wasDezoom = isDz;
  };
  try {
    const parentBody = window.parent.document.body;
    const apply = () => handle(parentBody.classList.contains('bg-open'));
    apply();
    new MutationObserver(apply).observe(parentBody, { attributes: true, attributeFilter: ['class'] });
  } catch(err) {
    window.addEventListener('message', function(e){
      if      (e.data === 'bg-open')  handle(true);
      else if (e.data === 'bg-close') handle(false);
    });
  }
})();

/* Relai mousemove au parent (curseur custom) */
window.addEventListener('mousemove', function(e){
  try { parent.postMessage({ type:'gleeden-mouse', x:e.clientX, y:e.clientY }, '*'); } catch(err){}
}, { passive: true });
/* Double-click / double-tap → toggle réduc/full */
window.addEventListener('dblclick', function(){
  try { parent.postMessage('toggle-bg', '*'); } catch(err){}
});
let _lastTap5 = 0;
window.addEventListener('touchend', function(e){
  const now = Date.now();
  if (now - _lastTap5 < 300) {
    try { parent.postMessage('toggle-bg', '*'); } catch(err){}
    e.preventDefault();
    _lastTap5 = 0;
  } else {
    _lastTap5 = now;
  }
}, { passive: false });
</script>
</body>
</html>
