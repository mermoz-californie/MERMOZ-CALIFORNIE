<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gleeden — App</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   SECTION APP — appstore.png + smartphone.png côte à côte
   Fond violet foncé fourni par le parent. Deux frames carrés arrondis
   avec un léger fond plus clair, fade-in à l'entrée (body.go).
   ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:        #551565;
  --frame-bg:  #280F37;        /* violet foncé pour cadrer sur le fond violet clair */
  --accent:    #C880EA;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html, body{ overflow:hidden; margin:0; width:100%; height:100%; cursor:none; background: transparent; }
body{
  background: transparent;
  display: flex;
  align-items: center; justify-content: center;
  width: 100vw; height: 100vh;
  font-family: 'PPObjectSans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
*{ cursor:none !important; }

/* ─── Stage : flex centré, 2 frames côte à côte ─── */
.stage{
  display: flex;
  align-items: center; justify-content: center;
  gap: 8vw;                                /* espace plus large entre les deux frames */
  width: 100%; height: 100%;
  padding: 0 4vw;
}

/* ─── Frame : carré arrondi avec fond plus foncé, image dedans en object-fit:cover ─── */
.frame{
  --s: min(30vw, 56vh);                    /* frames réduites */
  width: var(--s);
  height: var(--s);
  background: var(--frame-bg);
  border-radius: 16px;             /* uniformisé avec le standard du deck (panel-inner reduce + case3/case5/etc.) */
  overflow: hidden;
  position: relative;
  opacity: 0;
  transform: translateY(18px) scale(.97);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.16,1,.3,1);
}
/* Frame appstore : image un peu plus petite à l'intérieur du cadre (padding) */
.frame.left{ display: flex; align-items: center; justify-content: center; }
.frame.left img{ width: 78%; height: 78%; }
.frame img{
  width: 100%; height: 100%;
  object-fit: contain;     /* image entière visible — pas de crop */
  display: block;
}

/* ─── ENTRÉE — body.go déclenche le fade-in en cascade ─── */
body.go .frame.left  { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.10s; }
body.go .frame.right { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.25s; }
</style>
</head>
<body>

<div class="stage">
  <div class="frame left">
    <img src="../../assets/visuels/appstore.png" alt="Gleeden sur l'App Store">
  </div>
  <div class="frame right">
    <img src="../../assets/visuels/smartphone.png" alt="Gleeden sur l'écran d'accueil">
  </div>
</div>

<script>
function replay(){
  document.body.classList.remove('go');
  void document.body.offsetHeight;
  document.body.classList.add('go');
}
window.addEventListener('message', function(e){
  if (e.data === 'replay') replay();
});

/* Sync dezoom (pour cohérence du curseur custom etc.) */
(function syncDezoom(){
  try {
    const parentBody = window.parent.document.body;
    const apply = () => document.body.classList.toggle('dezoom', parentBody.classList.contains('bg-open'));
    apply();
    new MutationObserver(apply).observe(parentBody, { attributes:true, attributeFilter:['class'] });
  } catch(err){
    window.addEventListener('message', function(e){
      if      (e.data === 'bg-open')  document.body.classList.add('dezoom');
      else if (e.data === 'bg-close') document.body.classList.remove('dezoom');
    });
  }
})();

/* Relai mousemove au parent (curseur custom) */
window.addEventListener('mousemove', function(e){
  try { parent.postMessage({ type:'gleeden-mouse', x:e.clientX, y:e.clientY }, '*'); } catch(err){}
}, { passive: true });

/* Double-click / double-tap toggle réduc/full sur le parent */
window.addEventListener('dblclick', function(){
  try { parent.postMessage('toggle-bg', '*'); } catch(err){}
});
let _lastTap7 = 0;
window.addEventListener('touchend', function(e){
  const now = Date.now();
  if (now - _lastTap7 < 300){
    try { parent.postMessage('toggle-bg', '*'); } catch(err){}
    e.preventDefault();
    _lastTap7 = 0;
  } else {
    _lastTap7 = now;
  }
}, { passive: false });
</script>
</body>
</html>
