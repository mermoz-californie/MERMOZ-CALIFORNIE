<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gleeden — App</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   SECTION APP — appstore + smartphone (resserrés + grossis) + slides objets
   - Full  : 2 frames côte à côte (slide 1) puis 4 objets en scroll latéral
   - Réduc : fond bg1_gleeden.jpg + slide horizontal toujours utilisable
   ─────────────────────────────────────────────────────────────────────── */
:root{
  --bg:        #551565;
  --frame-bg:  #280F37;
  --accent:    #C880EA;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html, body{ overflow:hidden; margin:0; width:100%; height:100%; cursor:none; background: transparent; }
body{
  background: transparent;
  width: 100vw; height: 100vh;
  position: relative;
  font-family: 'PPObjectSans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  transition: background 0.4s ease;
}
*{ cursor:none !important; }

/* En mode réduc → fond bg1_gleeden.jpg dans l'iframe */
body.dezoom{
  background: url('../../assets/backgrounds/bg1_gleeden.jpg') center/cover no-repeat fixed;
}

/* ─── Scroll horizontal des slides ─── */
.page-scroll{
  position: absolute;
  inset: 0;
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}
.page-scroll::-webkit-scrollbar{ display: none; }

.page-slide{
  position: relative;
  flex: 0 0 100%;
  height: 100%;
  display: flex;
  align-items: center; justify-content: center;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
}

/* ─── Stage slide 1 : 2 frames côte à côte (resserrés + grossis) ─── */
.stage{
  display: flex;
  align-items: center; justify-content: center;
  gap: 2vw;                                /* resserré : 8vw → 2vw */
  width: 100%; height: 100%;
  padding: 0 2vw;
}

/* Frame plus gros + animation d'entrée */
.frame{
  --s: min(40vw, 78vh);                    /* grossi : min(30vw, 56vh) → min(40vw, 78vh) */
  width: var(--s);
  height: var(--s);
  background: var(--frame-bg);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  opacity: 0;
  transform: translateY(18px) scale(.97);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.16,1,.3,1);
}
.frame.left{ display: flex; align-items: center; justify-content: center; }
.frame.left img{ width: 78%; height: 78%; }
.frame img{
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}

/* Entrée — body.go cascade fade-in */
body.go .frame.left  { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.10s; }
body.go .frame.right { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.25s; }

/* ─── Slides objets — 2 frames par slide, même format que appstore/smartphone ─── */
.frame.objet{
  overflow: hidden;
}
.frame.objet img{
  width: 100%; height: 100%;
  object-fit: cover;            /* objet remplit la frame (carré) */
  display: block;
}
body.go .frame.objet.left  { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.10s; }
body.go .frame.objet.right { opacity: 1; transform: translateY(0) scale(1); transition-delay: 0.25s; }
</style>
</head>
<body>

<div class="page-scroll" id="pageScroll">
  <!-- Slide 1 — App Store + Smartphone (resserrés + grossis) -->
  <div class="page-slide">
    <div class="stage">
      <div class="frame left">
        <img src="../../assets/visuels/appstore.png" alt="Gleeden sur l'App Store">
      </div>
      <div class="frame right">
        <img src="../../assets/visuels/smartphone.png" alt="Gleeden sur l'écran d'accueil">
      </div>
    </div>
  </div>

  <!-- Slide 2 — Objets 1 + 2 dans 2 frames (même format que App Store) -->
  <div class="page-slide">
    <div class="stage">
      <div class="frame objet left">
        <img src="../../assets/visuels/objets1.jpg" alt="Gleeden objet 1">
      </div>
      <div class="frame objet right">
        <img src="../../assets/visuels/objets2.jpg" alt="Gleeden objet 2">
      </div>
    </div>
  </div>

  <!-- Slide 3 — Objets 3 + 4 -->
  <div class="page-slide">
    <div class="stage">
      <div class="frame objet left">
        <img src="../../assets/visuels/objets3.jpg" alt="Gleeden objet 3">
      </div>
      <div class="frame objet right">
        <img src="../../assets/visuels/objets4.jpg" alt="Gleeden objet 4">
      </div>
    </div>
  </div>
</div>

<script>
function replay(){
  document.body.classList.remove('go');
  void document.body.offsetHeight;
  document.body.classList.add('go');
  /* Reset scroll au début à chaque entrée */
  const ps = document.getElementById('pageScroll');
  if (ps) ps.scrollTo({ left: 0, behavior: 'instant' });
}
window.addEventListener('message', function(e){
  if (e.data === 'replay') replay();
});

/* Sync dezoom avec body.bg-open du parent */
(function syncDezoom(){
  try {
    const parentBody = window.parent.document.body;
    const apply = () => document.body.classList.toggle('dezoom', parentBody.classList.contains('bg-open'));
    apply();
    new MutationObserver(apply).observe(parentBody, { attributes:true, attributeFilter:['class'] });
  } catch(err){
    window.addEventListener('message', function(e){
      if      (e.data === 'bg-open')  document.body.classList.add('dezoom');
      else if (e.data === 'bg-close') document.body.classList.remove('dezoom');
    });
  }
})();

/* Relai mousemove au parent (curseur custom) */
window.addEventListener('mousemove', function(e){
  try { parent.postMessage({ type:'gleeden-mouse', x:e.clientX, y:e.clientY }, '*'); } catch(err){}
}, { passive: true });

/* Double-click / double-tap toggle réduc/full sur le parent */
window.addEventListener('dblclick', function(){
  try { parent.postMessage('toggle-bg', '*'); } catch(err){}
});
let _lastTap7 = 0;
window.addEventListener('touchend', function(e){
  const now = Date.now();
  if (now - _lastTap7 < 300){
    try { parent.postMessage('toggle-bg', '*'); } catch(err){}
    e.preventDefault();
    _lastTap7 = 0;
  } else {
    _lastTap7 = now;
  }
}, { passive: false });
</script>
</body>
</html>
